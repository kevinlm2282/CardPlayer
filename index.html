<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Jugador de Fútbol</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="tarjeta">
        <div class="contenido">
            <div class="cara frontal">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Lionel_Messi_20180626.jpg/630px-Lionel_Messi_20180626.jpg" alt="Jugador de Fútbol">
            <h2>Lionel Messi</h2>
            <p>Posición: Mediocampista</p>
            <button id="verDetalles">Ver Detalles</button>
        </div>
        <div class="cara posterior">
            <h2>Detalles del Jugador</h2>
            <p>Edad: 37 años</p>
            <p>Equipo: FC Barcelona</p>
            <p>Goles: 858</p>
            <button id="volver">Volver</button>
        </div>
        </div>
    </div>
   
    <script type="module" src="script.js"></script>
</body>
</html>
